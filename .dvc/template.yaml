  plink_qc:
    cmd: ./modules/imputation/run_qc.sh
    deps:
      - modules/imputation/run_qc.sh
      - modules/imputation/workflow
      - config/imputation/config_qc.yaml
      - data/snp/genotyping/donors.hg19.vcf.gz
      - data/snp/genotyping/donors.psam
      - data/snp/genotyping/id_map.tsv
      - resources/1000g/
    outs:
      - data/snp/plink_qc
      - logs/snp/plink_qc
  imputation:
    cmd: ./modules/imputation/run_imputation.sh
    deps:
      - modules/imputation/run_imputation.sh
      - modules/imputation/workflow
      - config/imputation/config_imputation.yaml
      - data/snp/genotyping/donors.hg38.vcf.gz
      - data/snp/plink_qc
      - data/snp/genotyping/id_map.tsv
      - resources/genomes/hg38/ref_panel_QC/30x-GRCh38_NoSamplesSorted.vcf.gz
      - resources/genomes/hg38/ref_genome_QC/Homo_sapiens.GRCh38.dna.primary_assembly.fa
      - resources/genomes/GRCh38_chr.fai
      - resources/liftover/GRCh37_to_GRCh38.chain.gz
      - resources/genomes/hg38/phasing/genetic_map/genetic_map_hg38_withX.txt.gz
      - resources/genomes/hg38/phasing/phasing_reference/
      - resources/reference/hg38/imputation
      - resources/bed/hg38exonsUCSC.bed
      - resources/genomes/chr_map/int2chr.txt
      - resources/genomes/chr_map/chr2int.txt
    outs:
      - data/snp/imputation
      - logs/snp/imputation
