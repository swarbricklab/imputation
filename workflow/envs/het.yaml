# vcftools --het + R (scripts/filter_het.R uses tidyverse + magrittr).
# R pinned to 3.6.3 to match the original .sif base image (r363_python368), for
# the same reason as envs/r.yaml -- keep the R stack identical across the workflow.
channels: [conda-forge, bioconda]
dependencies:
  - bioconda::vcftools=0.1.16
  - conda-forge::r-base=3.6.3
  - conda-forge::r-tidyverse
  - conda-forge::r-magrittr
