# vcftools --het + R (scripts/filter_het.R uses tidyverse + magrittr).
# Uses a current, maintained R (see envs/r.yaml for why matching the .sif's R 3.6.3
# was not necessary -- the .sif difference is BLAS numerics, not the R version).
channels: [conda-forge, bioconda]
dependencies:
  - bioconda::vcftools=0.1.16
  - conda-forge::r-base=4.3
  - conda-forge::r-tidyverse
  - conda-forge::r-magrittr
