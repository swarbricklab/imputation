# R + packages for scripts/PCA_Projection_Plotting.R (ancestry PCA projection).
# R pinned to 3.6.3 to match the original SNP_imputation_1000g_hg38.sif base image
# (drneavin/SingularityBaseImages:r363_python368): the ancestry call uses
# cluster::pam(), whose result on borderline samples is sensitive to the R /
# cluster / BLAS stack, so we track the .sif's R version to keep processing stable.
channels: [conda-forge, bioconda]
dependencies:
  - conda-forge::r-base=3.6.3
  - conda-forge::r-tidyverse
  - conda-forge::r-dplyr
  - conda-forge::r-ggpubr
  - conda-forge::r-rcolorbrewer
  - conda-forge::r-cluster
