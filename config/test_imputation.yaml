deps:
  input_vcf: test/data/test.hg38.vcf.gz
  post_qc_plink: test/results/post_qc
  id_map: test/data/id_map.tsv
  container: resources/imputation/SNP_imputation_1000g_hg38.sif

outs:
  results: test/results/imputation
  logs: logs/imputation/imputation

refs:
  vcf: resources/genomes/hg38/ref_panel_QC/30x-GRCh38_NoSamplesSorted.vcf.gz
  hg38_int_fa: resources/genomes/hg38/ref_genome_QC/Homo_sapiens.GRCh38.dna.primary_assembly.fa
  hg38_chr_fai: resources/genomes/GRCh38_chr.fai
  genetic_map: resources/genomes/hg38/phasing/genetic_map/genetic_map_hg38_withX.txt.gz
  phasing: resources/genomes/hg38/phasing/phasing_reference/
  impute: resources/reference/hg38/imputation
  bed: resources/bed/hg38exonsUCSC.bed
  int2chr: resources/genomes/chr_map/int2chr.txt
  chr2int: resources/genomes/chr_map/chr2int.txt

params:
    # the maximum proportion that can be missing for a snp to be included (5% by default)
    snp_missing_pct: 0.05
    # the threshold used for calling a SNP outside of HWE
    snp_hwe: 1e-6
    # length in Mb for minimac4 imputation chunks (20 by default)
    chunk_length: 40
    # Minimum MAF (=Minor Allele Frequency) applied in preimputation filtering
    pre_maf:  0.0
    # Minimum MAF applied in post-imputation filtering
    post_maf: 0.01

