
deps:
  input_vcf: data/snp/genotyping/donors.hg19.vcf.gz
  input_psam: data/snp/genotyping/donors.psam
  id_map: data/snp/genotyping/id_map.tsv
  container: resources/imputation/SNP_imputation_1000g_hg38.sif

outs:
  post_qc_plink: data/snp/plink_qc
  logs: logs/snp/plink_qc
  
refs:
  1000g:
    pgen: resources/1000g/all_phase3_filtered.pgen
    pvar: resources/1000g/all_phase3_filtered.pvar
    psam: resources/1000g/all_phase3_filtered.psam

params:
  indiv_missingness_mind: 0.05
  king_cutoff: 0.0884        # 2nd-degree+ relatives are removed
  king_table_cutoff: 0.0442  # 3rd-degree+ pairs appear in the .kin0 report
